openapi: 3.1.0
info:
  title: SARA-OMEGA V3.2.1 OAuth User Action
  version: 3.2.1
  description: OAuth-authenticated access to SARA-OMEGA personal continuity and governed solving.
servers:
  - url: https://sara-omega-production.up.railway.app
paths:
  /gpt/user/gateway:
    post:
      operationId: saraOmegaUserGateway
      summary: Use SARA with OAuth-bound personal continuity
      description: OAuth-authenticated SARA operation for governed solving and personal memory continuity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaraOmegaUserGatewayRequest'
      responses:
        '200':
          description: Governed user result or personal-memory response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request or missing explicit confirmation for memory deletion
        '401':
          description: Missing, invalid, expired, or revoked SARA OAuth access token
        '403':
          description: Required OAuth scope is not present
        '503':
          description: Identity persistence, encrypted memory, or fail-safe checkpointing is unavailable
components:
  schemas:
    SaraOmegaUserGatewayRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Selects the OAuth-authenticated personal SARA operation.
          enum:
            - solve
            - memory_status
            - memory_recall
            - memory_forget
        query:
          type: string
          maxLength: 5000
          description: User request for a governed solve operation.
        objective:
          type: string
          maxLength: 2000
          description: Optional target outcome for a solve operation.
        requested_action:
          type: string
          maxLength: 1000
          description: Optional action intent checked by SARA governance.
        context:
          type: object
          additionalProperties: true
          description: Non-secret user context. For memory_forget, context.confirm must be exactly true.
        council:
          type: boolean
          description: Optional request for SARA council routing.
        session_id:
          type: string
          maxLength: 256
          description: Conversation thread identifier. OAuth user identity owns cross-chat continuity.
