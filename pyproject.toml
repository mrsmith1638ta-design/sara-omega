[project]
name = "sara-omega"
version = "1.0.0"
description = "SARA-OMEGA governed decision-intelligence and AI orchestration core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.13.4,<3",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.32",
  "cryptography>=50,<51",
  "sqlalchemy>=2.0,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0"
]

[tool.setuptools.packages.find]
include = ["app*", "signer_service*", "sara_unified*"]
exclude = ["config*", "data*", "docs*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
