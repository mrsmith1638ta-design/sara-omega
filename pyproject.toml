[project]
name = "sara-omega"
version = "1.0.0"
description = "SARA-OMEGA governed decision-intelligence and AI orchestration core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.20",
  "cryptography>=42,<47"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "data*", "docs*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
