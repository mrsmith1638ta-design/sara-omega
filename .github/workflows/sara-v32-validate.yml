name: SARA-OMEGA V3.2.1 validation

on:
  push:
    branches: [main, sios-v32-failsafe-20260830]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-dev.txt
      - name: Validate critical imports
        run: |
          python - <<'PY'
          import cryptography
          import fastapi
          import httpx
          import pydantic
          import pytest
          import pytest_asyncio
          import uvicorn
          import SARA_AI_Product_Manager_Adaptive_Tutor_UNIFIED
          print("critical dependency imports passed")
          PY
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt
          python -m pip_audit -r voice_service/requirements.txt
      - name: Voice dependency boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path("requirements.txt").read_text(encoding="utf-8").lower()
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8").lower()
          voice = Path("voice_service/requirements.txt").read_text(encoding="utf-8").lower()
          assert "piper-tts" not in core
          assert "piper-tts" not in pyproject
          assert "piper-tts==1.8.0" in voice
          print("Piper remains isolated from SARA core dependencies")
          PY
      - name: Compile
        run: python -m compileall -q sara_unified voice_service && python -m py_compile main.py sara_v32_hardening.py sara_production_bootstrap.py sara_web.py SARA_AI_Product_Manager_Adaptive_Tutor_UNIFIED.py tools/*.py
      - name: Deployment shell sanitation
        run: |
          bash -n tools/*.sh
          test -f tools/railway_account_provision.sh
          test -f tools/railway_account_provision_windows.ps1
          test -f tools/railway_finalize_windows.ps1
          grep -q 'tools/railway_account_provision.sh' .github/workflows/railway-production-activate.yml
      - name: Native Windows activator syntax
        shell: pwsh
        run: |
          foreach ($path in @(
            "$PWD/tools/railway_account_provision_windows.ps1",
            "$PWD/tools/railway_finalize_windows.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              exit 1
            }
          }
      - name: Adaptive tutor tests
        run: pytest -q tests/test_adaptive_tutor.py
      - name: Production bootstrap tests
        run: pytest -q
      - name: SARA OMEGA V3.4.0 Riemann research adversarial gate
        run: pytest -q tests/science/test_riemann_*.py
      - name: Focused adversarial gate
        run: python tools/adversarial_gate.py
      - name: Riemann research engine tests
        run: pytest -q tests/science/test_riemann_*.py
      - name: Riemann false-proof adversarial gate
        run: python tools/riemann_adversarial_gate.py
      - name: Railway container build
        run: docker build --pull -t sara-omega:v3.2.1 .
      - name: Piper voice service container build
        run: docker build --pull -f voice_service/Dockerfile -t sara-piper-voice:1.0.0 .
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ROAD MCP validation
        working-directory: road-mcp
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run check
          npm run build
