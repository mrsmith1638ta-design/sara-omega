name: SARA live HTTP verify

on:
  push:
    branches: [repair/control-plane-20260904]
    paths:
      - '.sara-upload/VERIFY_LIVE'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production HTTP gates
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sara-omega-production.up.railway.app'
          for path in /health/live /health/ready /health/production-acceptance; do
            name="$(echo "$path" | sed 's#^/##; s#/#_#g')"
            out="/tmp/${name}.json"
            code="$(curl -sS --max-time 20 -o "$out" -w '%{http_code}' "$BASE$path")"
            echo "$path HTTP $code"
            cat "$out"
            echo
            test "$code" = 200
          done
          jq -e '.alive == true' /tmp/health_live.json >/dev/null
          jq -e '.ready == true' /tmp/health_ready.json >/dev/null
          jq -e '.production_accepted == true' /tmp/health_production-acceptance.json >/dev/null
