name: SARA-OMEGA V3.2.1 Railway zero-to-production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'context_dev_resolver.py'
      - 'chatgpt-gpt-action.yaml'
      - 'GPT_V321_CONFIG.md'
      - 'Context.Dev/**'
      - 'tests/test_context_dev_*.py'
      - 'tools/railway_account_provision.sh'
      - 'tools/railway_runtime_acceptance.py'
      - 'sara_production_bootstrap.py'
      - 'Procfile'
      - '.github/workflows/railway-production-activate.yml'

permissions:
  contents: read

concurrency:
  group: sara-omega-v321-railway-zero-to-production
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_LEGACY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve protected Railway credential
        id: credential
        shell: bash
        run: |
          if [ -n "${RAILWAY_ACCOUNT_TOKEN:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'source=RAILWAY_API_TOKEN' >> "$GITHUB_OUTPUT"
          elif [ -n "${RAILWAY_LEGACY_TOKEN:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'source=RAILWAY_TOKEN' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'source=none' >> "$GITHUB_OUTPUT"
            {
              echo '## SARA-OMEGA V3.2.1 zero-to-production'
              echo 'DEPLOYMENT BLOCKED: repository-level Railway authentication is unavailable.'
              echo 'No Railway changes were attempted.'
              echo 'This workflow fails closed so a green run always means Railway activation actually executed.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'Railway activation blocked: configure RAILWAY_API_TOKEN (preferred) or RAILWAY_TOKEN as a GitHub Actions secret.' >&2
            exit 1
          fi

      - name: Set up Node
        if: steps.credential.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Railway CLI and acceptance dependency
        if: steps.credential.outputs.available == 'true'
        run: |
          npm install --global @railway/cli
          python -m pip install --quiet httpx

      - name: Provision, deploy, restart, and verify SARA-OMEGA V3.2.1
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          if [ -n "${RAILWAY_ACCOUNT_TOKEN:-}" ]; then
            export RAILWAY_API_TOKEN="$RAILWAY_ACCOUNT_TOKEN"
          else
            export RAILWAY_API_TOKEN="$RAILWAY_LEGACY_TOKEN"
          fi
          unset RAILWAY_ACCOUNT_TOKEN RAILWAY_LEGACY_TOKEN
          bash -n tools/railway_account_provision.sh
          bash tools/railway_account_provision.sh

      - name: Publish production evidence
        if: steps.credential.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: sara-omega-v321-railway-production
          path: |
            railway-activation-report.json
            railway-public-url.txt
            first-boot-acceptance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Production summary
        if: steps.credential.outputs.available == 'true' && always()
        shell: bash
        run: |
          {
            echo '## SARA-OMEGA V3.2.1 zero-to-production'
            echo "Protected credential source: ${{ steps.credential.outputs.source }}"
            if [ -f railway-activation-report.json ]; then
              echo 'Railway provisioning completed and produced a production acceptance report.'
              echo '```json'
              cat railway-activation-report.json
              echo '```'
            else
              echo 'Provisioning did not reach the final acceptance report. Protected credentials are never printed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
