name: SARA-OMEGA V3.2.1 Railway direct-OAuth deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/railway-direct-oauth-deploy.yml'
      - 'tools/railway_direct_oauth.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sara-omega-v321-railway-exact-pair
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Railway CLI and acceptance dependency
        shell: bash
        run: |
          npm install --global @railway/cli
          python -m pip install --quiet httpx
          railway --version
          python -m py_compile tools/railway_direct_oauth.py tools/railway_runtime_acceptance.py

      - name: Authorize Railway through direct OAuth device exchange
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/railway_direct_oauth.py

      - name: Verify authenticated Railway identity
        run: railway whoami --json

      - name: Provision, deploy, restart, and verify SARA-OMEGA V3.2.1
        shell: bash
        run: bash tools/railway_account_provision.sh

      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sara-omega-v321-railway-direct-oauth-acceptance
          path: |
            railway-activation-report.json
            railway-public-url.txt
            first-boot-acceptance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Production summary
        if: success()
        shell: bash
        run: |
          URL="$(cat railway-public-url.txt)"
          {
            echo '## SARA-OMEGA V3.2.1 Railway production acceptance'
            echo 'Authentication: direct OAuth device exchange — PASS'
            echo 'Deployment: PASS'
            echo 'Persistent /data proof: PASS'
            echo 'Production acceptance: PASS'
            echo "Public URL: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
