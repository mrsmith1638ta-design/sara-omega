name: SARA-OMEGA V3.2.1 Railway exact-pair deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/railway-device-deploy-v2.yml'
      - 'tools/railway_account_provision.sh'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sara-omega-v321-railway-exact-pair
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Railway CLI and acceptance dependencies
        run: |
          npm install --global @railway/cli
          python -m pip install --quiet httpx
          railway --version

      - name: Publish exact Railway pairing request and wait for approval
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/railway-login.log"
          CLEAN="$RUNNER_TEMP/railway-login-clean.txt"
          : > "$LOG"

          # Run login in the background so the pairing code can be published while
          # the Railway CLI keeps the device-code session alive.
          railway login --browserless >"$LOG" 2>&1 &
          LOGIN_PID=$!

          for _ in $(seq 1 20); do
            sleep 1
            if [ -s "$LOG" ]; then
              sed -E $'s/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' "$LOG" > "$CLEAN" || cp "$LOG" "$CLEAN"
              if grep -Eqi 'pair|code|https?://' "$CLEAN"; then
                break
              fi
            fi
          done

          if [ ! -s "$CLEAN" ]; then
            kill "$LOGIN_PID" 2>/dev/null || true
            echo 'Railway CLI did not emit a pairing request.' >&2
            exit 20
          fi

          # Pairing output is short-lived authorization metadata, not a credential.
          # Limit the posted body to the initial login prompt only.
          PAIRING_TEXT="$(head -n 12 "$CLEAN")"
          ISSUE_URL="$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Railway approval required — SARA-OMEGA V3.2.1 run ${GITHUB_RUN_ID}" \
            --body "Railway is waiting for authorization for the active SARA-OMEGA V3.2.1 deployment. Use the exact URL and pairing code below. This code is short-lived and only authorizes the running Railway CLI session.\n\n\`\`\`text\n${PAIRING_TEXT}\n\`\`\`\n\nAfter approving it in Railway, the workflow continues automatically. Do not paste passwords or API tokens into this issue.")"
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "### Railway authorization" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact pairing request: $ISSUE_URL" >> "$GITHUB_STEP_SUMMARY"

          if ! wait "$LOGIN_PID"; then
            gh issue comment "$ISSUE_URL" --body 'Railway authorization did not complete successfully. This pairing request is no longer valid.' || true
            exit 21
          fi

          railway whoami
          gh issue comment "$ISSUE_URL" --body '✅ Railway authorization completed. SARA-OMEGA V3.2.1 provisioning has started.' || true
          gh issue close "$ISSUE_URL" --comment 'Pairing code consumed; closing this short-lived authorization request.' || true

      - name: Provision, deploy, restart, and verify V3.2.1
        shell: bash
        run: bash tools/railway_account_provision.sh

      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sara-omega-v321-railway-production-acceptance
          path: |
            railway-activation-report.json
            railway-public-url.txt
            first-boot-acceptance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Production summary
        if: success()
        shell: bash
        run: |
          URL="$(cat railway-public-url.txt)"
          {
            echo '## SARA-OMEGA V3.2.1 Railway production acceptance'
            echo '**PASS**'
            echo "Public URL: $URL"
            echo 'Persistent /data volume, encrypted fail-safe checkpointing, cross-boot persistence proof, readiness, and owner-protected acceptance checks passed.'
          } >> "$GITHUB_STEP_SUMMARY"
