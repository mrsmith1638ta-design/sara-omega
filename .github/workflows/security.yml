name: SARA Unified validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: pip install '.[dev]' pip-audit cyclonedx-bom
      - run: pytest -q
      - run: python -m compileall -q sara_unified
      - run: pip-audit
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sara-unified-sbom
          path: sbom.cdx.json
