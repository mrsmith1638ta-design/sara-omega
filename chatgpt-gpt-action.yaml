openapi: 3.1.0
info:
  title: SARA-OMEGA V3.2.1 Runtime and Governed Action Gateway
  version: 3.2.1
  description: Governed ChatGPT Action access to the live Railway SARA-OMEGA runtime, including OAuth-bound personal continuity, assurance, module truth, concentration control, Hawkins Chaos, TITAN health, fail-closed solving, and sanitized Context.dev authorization state.
servers:
  - url: https://sara-omega-production.up.railway.app
paths:
  /:
    get:
      operationId: getSaraOmegaIdentity
      summary: Get live SARA-OMEGA runtime identity
      description: Returns the live release version, base-runtime provenance, hardening profile, status, and platform.
      responses:
        '200':
          description: Live runtime identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health/ready:
    get:
      operationId: getSaraOmegaReadiness
      summary: Verify fail-closed runtime readiness
      description: Returns readiness only when the fail-safe runtime is ready.
      responses:
        '200':
          description: Runtime is ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Runtime is not ready and remains fail-closed
  /health/production-acceptance:
    get:
      operationId: getSaraOmegaProductionAcceptance
      summary: Get V3.2.1 production acceptance evidence
      description: Returns non-secret production evidence including persistence proof, dedicated mount status, checkpoint self-test, chain integrity, and production_accepted state.
      responses:
        '200':
          description: Production acceptance evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /public/live-state:
    get:
      operationId: getSaraOmegaPublicLiveState
      summary: Get public read-only live production state
      description: Returns sanitized live production observability without OAuth. This surface exposes no personal continuity, credentials, mutation, execution, or promotion authority.
      responses:
        '200':
          description: Public read-only live state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/production-acceptance:
    get:
      operationId: getRoadProductionAcceptance
      summary: Read ROAD production acceptance evidence without OAuth
      description: Returns sanitized live production attestation for ROAD. This is read-only evidence and never grants execution, promotion, mutation, or personal continuity authority.
      responses:
        '200':
          description: Public ROAD production attestation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /context-dev/status:
    get:
      operationId: getContextDevAuthorizationStatus
      summary: Get Context.dev commercial authorization status
      description: Returns the sanitized fail-closed Context.dev vendor authorization state. This endpoint does not execute Context.dev, expose credentials, or grant commercial permission.
      responses:
        '200':
          description: Sanitized Context.dev authorization status
          content:
            application/json:
              schema:
                type: object
                required:
                  - vendor
                  - service
                  - policy_id
                  - commercial_authorization
                  - monetized_runtime
                  - fail_mode
                  - credentials_configured
                  - vendor_transport_enabled
                  - production_authorization
                properties:
                  vendor:
                    type: string
                  service:
                    type: string
                  policy_id:
                    type: string
                  terms_version_reviewed:
                    type: string
                  commercial_authorization:
                    type: string
                    enum:
                      - UNVERIFIED
                      - PENDING_WRITTEN_AUTHORIZATION
                      - VERIFIED
                      - REVALIDATION_REQUIRED
                      - SUSPENDED
                  monetized_runtime:
                    type: string
                    enum: [ALLOWED, BLOCKED]
                  fail_mode:
                    type: string
                    enum: [CLOSED]
                  credentials_configured:
                    type: boolean
                  vendor_transport_enabled:
                    type: boolean
                  production_authorization:
                    type: string
                    enum: [BLOCKED, SCOPE_VERIFIED]
                additionalProperties: false
  /gpt/action/gateway:
    post:
      operationId: saraOmegaGovernedGateway
      summary: Route a non-personal governed SARA operation through Railway
      description: Compatibility gateway for shared owner/action/test credentials. Personal cross-chat memory is not exposed here; use the OAuth user gateway for personal continuity.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaraOmegaGatewayRequest'
      responses:
        '200':
          description: Governed SARA result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing required fields for the selected operation
        '401':
          description: Missing or invalid SARA Railway bearer token
        '429':
          description: SARA action gateway daily request limit reached
        '503':
          description: Runtime is fail-closed or a required assurance component is unavailable
  /gpt/action/voice/speak:
    post:
      operationId: saraOmegaSpeakInChat
      summary: Generate a playable governed SARA voice response for this GPT chat
      description: Uses the shared GPT Action bearer credential to synthesize text with SARA's governed Piper voice and returns a short-lived playable WAV audio artifact plus non-secret receipt metadata. This does not use OWNER_TOKEN and does not expose the private Piper service.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GPTActionVoiceSpeakRequest'
      responses:
        '200':
          description: Playable SARA voice artifact and digest-bound receipt
          content:
            application/json:
              schema:
                type: object
                required:
                  - audio_url
                  - artifact
                  - receipt
                  - secrets_included
                properties:
                  audio_url:
                    type: string
                    format: uri
                    description: Short-lived URL ChatGPT can present as SARA's playable WAV voice response.
                  artifact:
                    type: object
                    additionalProperties: true
                  receipt:
                    type: object
                    additionalProperties: true
                  secrets_included:
                    type: boolean
        '401':
          description: Missing or invalid GPT Action bearer token
        '403':
          description: OWNER_TOKEN or another non-action credential was supplied
        '422':
          description: Strict text validation failed
        '429':
          description: Daily GPT Action request limit reached
        '502':
          description: Piper synthesis failed safely
        '503':
          description: Voice synthesis or fail-safe dependency is unavailable
  /gpt/user/gateway:
    post:
      operationId: saraOmegaUserGateway
      summary: Use SARA with OAuth-bound personal continuity
      description: OAuth-only personal gateway. The authenticated SARA user identity owns encrypted continuity across separate GPT conversations. Shared compatibility credentials and privileged operational credentials do not grant personal-memory authority through this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaraOmegaUserGatewayRequest'
      responses:
        '200':
          description: Governed user result or personal-memory response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request or missing explicit confirmation for memory deletion
        '401':
          description: Missing, invalid, expired, or revoked SARA OAuth access token
        '403':
          description: Required OAuth scope is not present
        '503':
          description: Identity persistence, encrypted memory, or fail-safe checkpointing is unavailable
  /v1/accessibility/voice/jobs:
    post:
      operationId: createSaraAccessibilityVoiceJob
      summary: Read bounded text with the governed SARA voice
      description: Requires a SARA OAuth access token with sara.voice.accessibility and a current server-side entitlement. Tenant identity is resolved by SARA and cannot be supplied by the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceAccessibilityJobRequest'
      responses:
        '200':
          description: Completed governed voice job with digest-bound segment metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing, invalid, expired, or revoked OAuth access token
        '403':
          description: Required scope or active entitlement is absent
        '404':
          description: Voice 1.1A release gate is closed
        '409':
          description: User or tenant concurrency limit reached
        '422':
          description: Strict request validation failed
        '429':
          description: User or tenant usage limit reached
        '502':
          description: Isolated voice renderer failed safely
        '503':
          description: Required identity, persistence, fail-safe, or voice dependency is unavailable
  /v1/accessibility/voice/jobs/{jobId}:
    get:
      operationId: getSaraAccessibilityVoiceJob
      summary: Get an owned accessibility voice job
      description: Requires sara.voice.accessibility. Missing and non-owned jobs both return 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VoiceJobId'
      responses:
        '200':
          description: Private no-store job metadata
        '404':
          description: Job is absent or not owned by the authenticated user and tenant
  /v1/accessibility/voice/jobs/{jobId}/stop:
    post:
      operationId: stopSaraAccessibilityVoiceJob
      summary: Stop an owned accessibility voice job
      description: Idempotently prevents later sentence synthesis when the owned job can still be stopped.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VoiceJobId'
      responses:
        '200':
          description: Private no-store stopped job metadata
        '404':
          description: Job is absent or not owned by the authenticated user and tenant
  /v1/accessibility/voice/jobs/{jobId}/segments/{segmentId}/audio:
    get:
      operationId: getSaraAccessibilityVoiceSegmentAudio
      summary: Fetch one owned WAV segment
      description: Returns authenticated audio with Cache-Control private, no-store. No durable public audio URL is created.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VoiceJobId'
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Governed WAV audio segment
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '404':
          description: Segment is absent or not owned by the authenticated user and tenant
  /v1/accessibility/voice/jobs/{jobId}/receipts:
    get:
      operationId: getSaraAccessibilityVoiceReceipts
      summary: Fetch digest-bound receipts for an owned job
      description: Returns Voice 1.1 receipts and a Voice 1.1A ownership-envelope digest without raw user or tenant identifiers.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VoiceJobId'
      responses:
        '200':
          description: Private no-store receipt metadata
        '404':
          description: Receipts are absent or not owned by the authenticated user and tenant
  /v1/accessibility/voice/jobs/{jobId}/transcript:
    get:
      operationId: getSaraAccessibilityVoiceTranscript
      summary: Fetch an explicitly preserved owned transcript
      description: Returns an encrypted-at-rest transcript only before its bounded retention deadline, with Cache-Control private, no-store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VoiceJobId'
      responses:
        '200':
          description: Private no-store transcript
        '404':
          description: Transcript is absent, expired, disabled, or not owned
  /v1/accessibility/voice/preferences:
    get:
      operationId: getSaraAccessibilityVoicePreferences
      summary: Get bounded accessibility voice preferences
      description: Requires sara.voice.accessibility and a current entitlement.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Private no-store preferences
    put:
      operationId: putSaraAccessibilityVoicePreferences
      summary: Set bounded accessibility voice preferences
      description: Accepts only certified speech-rate presets and bounded transcript retention choices.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceAccessibilityPreferencesRequest'
      responses:
        '200':
          description: Updated private no-store preferences
        '422':
          description: Strict preference validation failed
components:
  parameters:
    VoiceJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SaraOmegaGatewayRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Selects the governed Railway backend operation.
          enum:
            - status
            - production_acceptance
            - module_awareness
            - runtime_assurance
            - concentration
            - hawkins_chaos
            - madhouse_review
            - titan_health
            - solve
            - verify_output
        query:
          type: string
          description: User request to reason over when operation is solve.
        objective:
          type: string
          description: Optional target outcome for a solve operation.
        requested_action:
          type: string
          description: Optional action intent checked by SARA governance.
        module:
          type: string
          default: sara-chatgpt-action
          description: Module name for audit receipts and output verification.
        output:
          type: string
          description: Generated text to verify before ChatGPT repeats it.
        context:
          type: object
          additionalProperties: true
          description: Non-secret context, live module truth, evidence hints, or Madhouse review fields such as candidate_id, language, generated_code, requirements, and previous_failures.
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional evidence objects supplied by ChatGPT or upstream tools.
        fail_closed:
          type: boolean
          default: true
          description: When true, unsupported checkable claims are suppressed.
        council:
          type: boolean
          description: Optional request for SARA council routing.
        session_id:
          type: string
          description: Optional stable session id for rate-limit grouping.
    SaraOmegaUserGatewayRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Selects the OAuth-authenticated personal SARA operation.
          enum:
            - solve
            - memory_status
            - memory_recall
            - memory_forget
        query:
          type: string
          maxLength: 5000
          description: User request for a governed solve operation.
        objective:
          type: string
          maxLength: 2000
          description: Optional target outcome for a solve operation.
        requested_action:
          type: string
          maxLength: 1000
          description: Optional action intent checked by SARA governance.
        context:
          type: object
          additionalProperties: true
          description: Non-secret user context. For memory_forget, context.confirm must be exactly true.
        council:
          type: boolean
          description: Optional request for SARA council routing.
        session_id:
          type: string
          maxLength: 256
          description: The session id is a conversation thread identifier only; the authenticated SARA OAuth user identity owns cross-chat continuity.
    GPTActionVoiceSpeakRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: Text that SARA should speak back inside the GPT chat. The response returns a playable governed Piper WAV artifact.
        session_id:
          type: string
          maxLength: 256
          description: Optional conversation identifier for bounded rate-limit grouping.
    VoiceAccessibilityJobRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        speech_rate:
          type: string
          enum: [slower, normal, faster]
        preserve_transcript:
          type: boolean
          default: false
    VoiceAccessibilityPreferencesRequest:
      type: object
      additionalProperties: false
      required:
        - speech_rate
        - preserve_transcript
        - transcript_retention_seconds
      properties:
        speech_rate:
          type: string
          enum: [slower, normal, faster]
        preserve_transcript:
          type: boolean
        transcript_retention_seconds:
          type: integer
          enum: [0, 900, 3600, 86400]
