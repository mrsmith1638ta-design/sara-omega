openapi: 3.1.0
info:
  title: SARA-OMEGA V3.2.1 Runtime and Governed Action Gateway
  version: 3.2.1
  description: Governed ChatGPT Action access to the live Railway SARA-OMEGA runtime, including OAuth-bound personal continuity, assurance, module truth, concentration control, Hawkins Chaos, TITAN health, fail-closed solving, and sanitized Context.dev authorization state.
servers:
  - url: https://sara-omega-production.up.railway.app
paths:
  /:
    get:
      operationId: getSaraOmegaIdentity
      summary: Get live SARA-OMEGA runtime identity
      description: Returns the live release version, base-runtime provenance, hardening profile, status, and platform.
      responses:
        '200':
          description: Live runtime identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health/ready:
    get:
      operationId: getSaraOmegaReadiness
      summary: Verify fail-closed runtime readiness
      description: Returns readiness only when the fail-safe runtime is ready.
      responses:
        '200':
          description: Runtime is ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Runtime is not ready and remains fail-closed
  /health/production-acceptance:
    get:
      operationId: getSaraOmegaProductionAcceptance
      summary: Get V3.2.1 production acceptance evidence
      description: Returns non-secret production evidence including persistence proof, dedicated mount status, checkpoint self-test, chain integrity, and production_accepted state.
      responses:
        '200':
          description: Production acceptance evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /context-dev/status:
    get:
      operationId: getContextDevAuthorizationStatus
      summary: Get Context.dev commercial authorization status
      description: Returns the sanitized fail-closed Context.dev vendor authorization state. This endpoint does not execute Context.dev, expose credentials, or grant commercial permission.
      responses:
        '200':
          description: Sanitized Context.dev authorization status
          content:
            application/json:
              schema:
                type: object
                required:
                  - vendor
                  - service
                  - policy_id
                  - commercial_authorization
                  - monetized_runtime
                  - fail_mode
                  - credentials_configured
                  - vendor_transport_enabled
                  - production_authorization
                properties:
                  vendor:
                    type: string
                  service:
                    type: string
                  policy_id:
                    type: string
                  terms_version_reviewed:
                    type: string
                  commercial_authorization:
                    type: string
                    enum:
                      - UNVERIFIED
                      - PENDING_WRITTEN_AUTHORIZATION
                      - VERIFIED
                      - REVALIDATION_REQUIRED
                      - SUSPENDED
                  monetized_runtime:
                    type: string
                    enum: [ALLOWED, BLOCKED]
                  fail_mode:
                    type: string
                    enum: [CLOSED]
                  credentials_configured:
                    type: boolean
                  vendor_transport_enabled:
                    type: boolean
                  production_authorization:
                    type: string
                    enum: [BLOCKED, SCOPE_VERIFIED]
                additionalProperties: false
  /gpt/action/gateway:
    post:
      operationId: saraOmegaGovernedGateway
      summary: Route a non-personal governed SARA operation through Railway
      description: Compatibility gateway for shared owner/action/test credentials. Personal cross-chat memory is not exposed here; use the OAuth user gateway for personal continuity.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaraOmegaGatewayRequest'
      responses:
        '200':
          description: Governed SARA result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing required fields for the selected operation
        '401':
          description: Missing or invalid SARA Railway bearer token
        '429':
          description: SARA action gateway daily request limit reached
        '503':
          description: Runtime is fail-closed or a required assurance component is unavailable
  /gpt/user/gateway:
    post:
      operationId: saraOmegaUserGateway
      summary: Use SARA with OAuth-bound personal continuity
      description: OAuth-only personal gateway. The authenticated SARA user identity owns encrypted continuity across separate GPT conversations. Shared GPT Action, test, owner, source-control, and Railway-control credentials do not grant personal-memory authority through this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaraOmegaUserGatewayRequest'
      responses:
        '200':
          description: Governed user result or personal-memory response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request or missing explicit confirmation for memory deletion
        '401':
          description: Missing, invalid, expired, or revoked SARA OAuth access token
        '403':
          description: Required OAuth scope is not present
        '503':
          description: Identity persistence, encrypted memory, or fail-safe checkpointing is unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SaraOmegaGatewayRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Selects the governed Railway backend operation.
          enum:
            - status
            - production_acceptance
            - module_awareness
            - runtime_assurance
            - concentration
            - hawkins_chaos
            - titan_health
            - solve
            - verify_output
        query:
          type: string
          description: User request to reason over when operation is solve.
        objective:
          type: string
          description: Optional target outcome for a solve operation.
        requested_action:
          type: string
          description: Optional action intent checked by SARA governance.
        module:
          type: string
          default: sara-chatgpt-action
          description: Module name for audit receipts and output verification.
        output:
          type: string
          description: Generated text to verify before ChatGPT repeats it.
        context:
          type: object
          additionalProperties: true
          description: Non-secret context, live module truth, or evidence hints.
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional evidence objects supplied by ChatGPT or upstream tools.
        fail_closed:
          type: boolean
          default: true
          description: When true, unsupported checkable claims are suppressed.
        council:
          type: boolean
          description: Optional request for SARA council routing.
        session_id:
          type: string
          description: Optional stable session id for rate-limit grouping.
    SaraOmegaUserGatewayRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Selects the OAuth-authenticated personal SARA operation.
          enum:
            - solve
            - memory_status
            - memory_recall
            - memory_forget
        query:
          type: string
          maxLength: 5000
          description: User request for a governed solve operation.
        objective:
          type: string
          maxLength: 2000
          description: Optional target outcome for a solve operation.
        requested_action:
          type: string
          maxLength: 1000
          description: Optional action intent checked by SARA governance.
        context:
          type: object
          additionalProperties: true
          description: Non-secret user context. For memory_forget, context.confirm must be exactly true.
        council:
          type: boolean
          description: Optional request for SARA council routing.
        session_id:
          type: string
          maxLength: 256
          description: The session id is a conversation thread identifier only; the authenticated SARA OAuth user identity owns cross-chat continuity.
