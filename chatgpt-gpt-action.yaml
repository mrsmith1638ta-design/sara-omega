openapi: 3.1.0
info:
  title: SARA-OMEGA V3.2.1 Runtime and Governed Action Gateway
  version: 3.2.1
  description: One governed ChatGPT Action path into the live Railway SARA-OMEGA runtime for assurance, module truth, concentration control, Hawkins Chaos, TITAN health, fail-closed solving, and sanitized Context.dev authorization state.
servers:
  - url: https://sara-omega-production.up.railway.app
paths:
  /:
    get:
      operationId: getSaraOmegaIdentity
      summary: Get live SARA-OMEGA runtime identity
      description: Returns the live release version, base-runtime provenance, hardening profile, status, and platform.
      responses:
        '200':
          description: Live runtime identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /health/ready:
    get:
      operationId: getSaraOmegaReadiness
      summary: Verify fail-closed runtime readiness
      description: Returns readiness only when the fail-safe runtime is ready.
      responses:
        '200':
          description: Runtime is ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Runtime is not ready and remains fail-closed
  /health/production-acceptance:
    get:
      operationId: getSaraOmegaProductionAcceptance
      summary: Get V3.2.1 production acceptance evidence
      description: Returns non-secret production evidence including persistence proof, dedicated mount status, checkpoint self-test, chain integrity, and production_accepted state.
      responses:
        '200':
          description: Production acceptance evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /context-dev/status:
    get:
      operationId: getContextDevAuthorizationStatus
      summary: Get Context.dev commercial authorization status
      description: Returns the sanitized fail-closed Context.dev vendor authorization state. This endpoint does not execute Context.dev, expose credentials, or grant commercial permission.
      responses:
        '200':
          description: Sanitized Context.dev authorization status
          content:
            application/json:
              schema:
                type: object
                required:
                  - vendor
                  - service
                  - policy_id
                  - commercial_authorization
                  - monetized_runtime
                  - fail_mode
                  - credentials_configured
                  - vendor_transport_enabled
                  - production_authorization
                properties:
                  vendor:
                    type: string
                  service:
                    type: string
                  policy_id:
                    type: string
                  terms_version_reviewed:
                    type: string
                  commercial_authorization:
                    type: string
                    enum:
                      - UNVERIFIED
                      - PENDING_WRITTEN_AUTHORIZATION
                      - VERIFIED
                      - REVALIDATION_REQUIRED
                      - SUSPENDED
                  monetized_runtime:
                    type: string
                    enum: [ALLOWED, BLOCKED]
                  fail_mode:
                    type: string
                    enum: [CLOSED]
                  credentials_configured:
                    type: boolean
                  vendor_transport_enabled:
                    type: boolean
                  production_authorization:
                    type: string
                    enum: [BLOCKED, SCOPE_VERIFIED]
                additionalProperties: false
  /gpt/action/gateway:
    post:
      operationId: saraOmegaGovernedGateway
      summary: Route a governed SARA operation through Railway
      description: Uses Railway V3.2.1 auth, fail-safe readiness, audit receipts, module awareness, concentration control, runtime assurance, Hawkins Chaos, and TITAN status.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaraOmegaGatewayRequest'
      responses:
        '200':
          description: Governed SARA result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing required fields for the selected operation
        '401':
          description: Missing or invalid SARA Railway bearer token
        '429':
          description: SARA action gateway daily request limit reached
        '503':
          description: Runtime is fail-closed or a required assurance component is unavailable
  /road/health:
    get:
      operationId: getRoadHealth
      summary: Get ROAD live health
      description: Returns the headless ROAD service health and production-acceptance state.
      responses:
        '200':
          description: ROAD health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/tools:
    get:
      operationId: getRoadToolDiscovery
      summary: Discover ROAD tools
      description: Returns the authoritative ROAD 11-tool set without UI resources.
      responses:
        '200':
          description: ROAD tool discovery
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/get_completion_overview:
    post:
      operationId: get_completion_overview
      summary: Get ROAD completion overview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD completion overview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/get_completion_track:
    post:
      operationId: get_completion_track
      summary: Get one ROAD completion track
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD completion track
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/suggest_next_build_phase:
    post:
      operationId: suggest_next_build_phase
      summary: Suggest the next ROAD build phase
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD next build phase
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/get_live_runtime_status:
    post:
      operationId: get_live_runtime_status
      summary: Get ROAD live runtime status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD live runtime status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/get_production_acceptance:
    post:
      operationId: get_production_acceptance
      summary: Get ROAD production acceptance
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD production acceptance
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/get_contextdev_authorization:
    post:
      operationId: get_contextdev_authorization
      summary: Get ROAD Context.dev authorization status
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD Context.dev authorization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/get_gate_evidence:
    post:
      operationId: get_gate_evidence
      summary: Get ROAD gate evidence
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD gate evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/get_blocking_dependencies:
    post:
      operationId: get_blocking_dependencies
      summary: Get ROAD blocking dependencies
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD blocking dependencies
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/run_certification_check:
    post:
      operationId: run_certification_check
      summary: Run ROAD certification checks
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD certification check
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/verify_release_candidate:
    post:
      operationId: verify_release_candidate
      summary: Verify ROAD release candidate
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD release candidate verification
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /road/actions/generate_completion_manifest:
    post:
      operationId: generate_completion_manifest
      summary: Generate ROAD completion manifest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadToolRequest'
      responses:
        '200':
          description: ROAD completion manifest
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SaraOmegaGatewayRequest:
      type: object
      additionalProperties: false
      required:
        - operation
      properties:
        operation:
          type: string
          description: Selects the governed Railway backend operation.
          enum:
            - status
            - production_acceptance
            - module_awareness
            - runtime_assurance
            - concentration
            - hawkins_chaos
            - madhouse_review
            - titan_health
            - solve
            - verify_output
        query:
          type: string
          description: User request to reason over when operation is solve.
        objective:
          type: string
          description: Optional target outcome for a solve operation.
        requested_action:
          type: string
          description: Optional action intent checked by SARA governance.
        module:
          type: string
          default: sara-chatgpt-action
          description: Module name for audit receipts and output verification.
        output:
          type: string
          description: Generated text to verify before ChatGPT repeats it.
        context:
          type: object
          additionalProperties: true
          description: Non-secret context, live module truth, evidence hints, or Madhouse review fields such as candidate_id, language, generated_code, requirements, and previous_failures.
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional evidence objects supplied by ChatGPT or upstream tools.
        fail_closed:
          type: boolean
          default: true
          description: When true, unsupported checkable claims are suppressed.
        council:
          type: boolean
          description: Optional request for SARA council routing.
        session_id:
          type: string
          description: Optional stable session id for rate-limit grouping.
    RoadToolRequest:
      type: object
      additionalProperties: false
      properties:
        arguments:
          type: object
          additionalProperties: true
          description: Optional ROAD tool arguments.
